name: Kernel Build Munch with Variants

on:
  workflow_dispatch:
    inputs:
      KERNEL_VARIANT:
        description: "Kernel Variant"
        type: choice
        options:
          - "No KernelSU"
          - "KernelSU-Next Only"
          - "KernelSU-Next with SuSFS"
          - "Build All Variants"
          - "Custom Configuration"
        default: "Build All Variants"
        required: true
      
      # Custom options (used when Custom Configuration is selected)
      KERNEL_TREE:
        description: "Kernel Tree (Custom)"
        default: "https://github.com/bimoalfarrabi/kernel_xiaomi_sm8250_n0kontzz"
        required: false
      KERNEL_TREE_BRANCH:
        description: "Kernel Tree Branch (Custom)"
        required: false
        default: "susfs-v1.5.5-munch"
      ADD_KERNELSU:
        description: "Add KernelSU (Custom)"
        type: boolean
        default: true
      KERNELSU_NAME:
        description: "KernelSU Name (Custom)"
        required: false
        default: "KSUN"
      KERNELSU_SETUP_URL:
        description: "KernelSU Setup URL (Custom)"
        required: false
        default: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next/kernel/setup.sh"
      KERNELSU_SETUP_BRANCH:
        description: "KernelSU Branch (Custom)"
        required: false
        default: "next-susfs-dev"
      ANYKERNEL_URL:
        description: "AnyKernel URL (Custom)"
        default: "https://github.com/bimoalfarrabi/AKmunch"
        required: false
      ANYKERNEL_BRANCH:
        description: "AnyKernel Branch (Custom)"
        default: "main"
        required: false
      ANYKERNEL_ZIP_NAME:
        description: "File name base (Custom, without .zip extension)"
        default: "N0Kontzzz-munch"
        required: false

jobs:
  prepare:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    outputs:
      build_mode: ${{ steps.set-mode.outputs.build_mode }}
      release_tag: ${{ steps.build-info.outputs.release_tag }}
    steps:
      - name: Set build mode
        id: set-mode
        run: |
          if [ "${{ github.event.inputs.KERNEL_VARIANT }}" = "Build All Variants" ]; then
            echo "build_mode=matrix" >> $GITHUB_OUTPUT
          else
            echo "build_mode=single" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate build info
        id: build-info
        run: |
          # Generate date-time stamp in format YYYYMMDD-HHMM
          DATE_TIME=$(date '+%Y%m%d-%H%M')
          echo "build_date=${DATE_TIME}" >> $GITHUB_OUTPUT
          echo "release_tag=${DATE_TIME}" >> $GITHUB_OUTPUT
          
          echo "Build date: ${DATE_TIME}"
          echo "Generated release tag: ${DATE_TIME}"

  build-matrix:
    needs: prepare
    if: needs.prepare.outputs.build_mode == 'matrix'
    strategy:
      matrix:
        variant:
          - name: "No-KSU"
            branch: "base-munch"
            add_ksu: false
            ksu_name: "None"
            ksu_setup_url: "none"
            ksu_setup_branch: "none"
          - name: "KSUN-Only"
            branch: "base-munch"
            add_ksu: true
            ksu_name: "KSUN"
            ksu_setup_url: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next/kernel/setup.sh"
            ksu_setup_branch: "next"
          - name: "KSUN-SuSFS"
            branch: "susfs-v1.5.5-munch"
            add_ksu: true
            ksu_name: "KSUN"
            ksu_setup_url: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh"
            ksu_setup_branch: "next-susfs-dev"
    runs-on: ubuntu-latest
    env:
      CLANG_DOWNLOAD_LINK: https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz
      KERNEL_REPO_URL: https://github.com/bimoalfarrabi/kernel_xiaomi_sm8250_n0kontzz
      DTBO_REPO_URL: https://github.com/bimoalfarrabi/AKmunch
      DTBO_REPO_BRANCH: main
    steps:
      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-21
          restore-keys: |
            aosp-clang-21-

      - name: Download and Extract Clang (if not cached)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget "${{ env.CLANG_DOWNLOAD_LINK }}" -O clang.tar.xz
          mkdir -p clang
          tar -xf clang.tar.xz -C clang

          cd clang
          if [ -d clang-* ]; then
            mv clang-*/* .
          fi
          cd ..
          
          rm clang.tar.xz

      - name: Initialize workspace
        run: |
          echo "tools_folder=$(pwd)" >> $GITHUB_OUTPUT
          git clone --depth=1 ${KERNEL_REPO_URL} -b ${{ matrix.variant.branch }} kernel_tree
          echo "kernel_folder=$(pwd)/kernel_tree" >> $GITHUB_OUTPUT
          
          # Create releases directory
          mkdir -p releases
        id: workspace

      - name: Building kernel
        run: |
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="${{ github.actor }}"
          export KBUILD_BUILD_HOST="GitHub"
          
          if [ ${{ matrix.variant.add_ksu }} == 'true' ]; then
            curl -LSs "${{ matrix.variant.ksu_setup_url }}" | bash -s ${{ matrix.variant.ksu_setup_branch }}
          fi

          make O=out vendor/munch_defconfig PATH="${{ steps.workspace.outputs.tools_folder }}/clang/bin:$PATH"
          make O=out CC=clang -j$(nproc --all) PATH="${{ steps.workspace.outputs.tools_folder }}/clang/bin:$PATH" CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}

      - name: Prepare kernel files for packaging
        run: |
          # Create a directory to store build artifacts
          mkdir -p kernel_files
          
          # Copy all required files
          if [ -e "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/Image.gz" ]; then
            cp "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/Image.gz" kernel_files/
          fi
          
          if [ -e "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtb.img" ]; then
            cp "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtb.img" kernel_files/
          fi
          
          if [ -e "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtbo.img" ]; then
            cp "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtbo.img" kernel_files/
          fi

      - name: Clone DTBO Repository
        run: |
          # Clone the AKMunch repository to get DTBO variants
          git clone --depth=1 ${DTBO_REPO_URL} -b ${DTBO_REPO_BRANCH} dtbo-source || true
          
          # Create variant directories for different DTBOs
          mkdir -p miui ir default
          
          # Copy the original DTBO to default
          cp -f kernel_files/dtbo.img default/ || true
          
          # Copy variant DTBOs from repository if available
          cp -f dtbo-source/miui/dtbo.img miui/ || cp -f kernel_files/dtbo.img miui/ || true
          cp -f dtbo-source/ir/dtbo.img ir/ || cp -f kernel_files/dtbo.img ir/ || true

      - name: Generate filename
        id: generate-filename
        run: |
          # Base name with variant suffix
          BASE_NAME="N0Kontzzz-munch"
          
          if [ "${{ matrix.variant.add_ksu }}" == 'true' ]; then
            BASE_NAME="${BASE_NAME}-${{ matrix.variant.ksu_name }}"
          fi
          
          # Add SuSFS to name if using SuSFS branch
          if [[ "${{ matrix.variant.branch }}" == *"susfs"* ]]; then
            BASE_NAME="${BASE_NAME}-SuSFS"
          fi
          
          # Add date-time
          FILENAME="${BASE_NAME}-${{ needs.prepare.outputs.release_tag }}"
          
          echo "FILENAME=${FILENAME}" >> $GITHUB_OUTPUT
          echo "Generated filename: ${FILENAME}"

      - name: Package Unified Kernel
        run: |
          # Clone AnyKernel repository
          git clone --recursive --depth=1 https://github.com/bimoalfarrabi/AKmunch -b main AnyKernel3
          
          # Copy kernel files to AnyKernel3
          cp -f kernel_files/Image.gz AnyKernel3/ || true
          cp -f kernel_files/dtb.img AnyKernel3/dtb || true
          
          # Copy the default DTBO to root
          cp -f default/dtbo.img AnyKernel3/dtbo.img || true
          
          # Create variant directories and copy DTBOs
          mkdir -p AnyKernel3/miui
          mkdir -p AnyKernel3/ir
          cp -f miui/dtbo.img AnyKernel3/miui/dtbo.img || true
          cp -f ir/dtbo.img AnyKernel3/ir/dtbo.img || true
          
          # Create zip
          cd AnyKernel3
          zip -q -r "${FILENAME}.zip" *
          mv "${FILENAME}.zip" ../releases/
        env:
          FILENAME: ${{ steps.generate-filename.outputs.FILENAME }}

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate-filename.outputs.FILENAME }}
          path: releases/${{ steps.generate-filename.outputs.FILENAME }}.zip
          retention-days: 1

  build-single:
    needs: prepare
    if: needs.prepare.outputs.build_mode == 'single'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLANG_DOWNLOAD_LINK: https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz
      KERNEL_REPO_URL: https://github.com/bimoalfarrabi/kernel_xiaomi_sm8250_n0kontzz
      DTBO_REPO_URL: https://github.com/bimoalfarrabi/AKmunch
      DTBO_REPO_BRANCH: main
    steps:
      - name: Set kernel configuration
        id: kernel-config
        run: |
          if [ "${{ github.event.inputs.KERNEL_VARIANT }}" = "No KernelSU" ]; then
            echo "KERNEL_TREE=$KERNEL_REPO_URL" >> $GITHUB_OUTPUT
            echo "KERNEL_TREE_BRANCH=base-munch" >> $GITHUB_OUTPUT
            echo "ADD_KERNELSU=false" >> $GITHUB_OUTPUT
            echo "KERNELSU_NAME=None" >> $GITHUB_OUTPUT
            echo "KERNELSU_SETUP_URL=none" >> $GITHUB_OUTPUT
            echo "KERNELSU_SETUP_BRANCH=none" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_URL=https://github.com/bimoalfarrabi/AKmunch" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_BRANCH=main" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_ZIP_NAME=N0Kontzzz-munch" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.KERNEL_VARIANT }}" = "KernelSU-Next Only" ]; then
            echo "KERNEL_TREE=$KERNEL_REPO_URL" >> $GITHUB_OUTPUT
            echo "KERNEL_TREE_BRANCH=base-munch" >> $GITHUB_OUTPUT
            echo "ADD_KERNELSU=true" >> $GITHUB_OUTPUT
            echo "KERNELSU_NAME=KSUN" >> $GITHUB_OUTPUT
            echo "KERNELSU_SETUP_URL=https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next/kernel/setup.sh" >> $GITHUB_OUTPUT
            echo "KERNELSU_SETUP_BRANCH=next" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_URL=https://github.com/bimoalfarrabi/AKmunch" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_BRANCH=main" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_ZIP_NAME=N0Kontzzz-munch" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.KERNEL_VARIANT }}" = "KernelSU-Next with SuSFS" ]; then
            echo "KERNEL_TREE=$KERNEL_REPO_URL" >> $GITHUB_OUTPUT
            echo "KERNEL_TREE_BRANCH=susfs-v1.5.5-munch" >> $GITHUB_OUTPUT
            echo "ADD_KERNELSU=true" >> $GITHUB_OUTPUT
            echo "KERNELSU_NAME=KSUN" >> $GITHUB_OUTPUT
            echo "KERNELSU_SETUP_URL=https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" >> $GITHUB_OUTPUT
            echo "KERNELSU_SETUP_BRANCH=next-susfs-dev" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_URL=https://github.com/bimoalfarrabi/AKmunch" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_BRANCH=main" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_ZIP_NAME=N0Kontzzz-munch" >> $GITHUB_OUTPUT
          else
            # Custom configuration
            echo "KERNEL_TREE=${{ github.event.inputs.KERNEL_TREE }}" >> $GITHUB_OUTPUT
            echo "KERNEL_TREE_BRANCH=${{ github.event.inputs.KERNEL_TREE_BRANCH }}" >> $GITHUB_OUTPUT
            echo "ADD_KERNELSU=${{ github.event.inputs.ADD_KERNELSU }}" >> $GITHUB_OUTPUT
            echo "KERNELSU_NAME=${{ github.event.inputs.KERNELSU_NAME }}" >> $GITHUB_OUTPUT
            echo "KERNELSU_SETUP_URL=${{ github.event.inputs.KERNELSU_SETUP_URL }}" >> $GITHUB_OUTPUT
            echo "KERNELSU_SETUP_BRANCH=${{ github.event.inputs.KERNELSU_SETUP_BRANCH }}" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_URL=${{ github.event.inputs.ANYKERNEL_URL }}" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_BRANCH=${{ github.event.inputs.ANYKERNEL_BRANCH }}" >> $GITHUB_OUTPUT
            echo "ANYKERNEL_ZIP_NAME=${{ github.event.inputs.ANYKERNEL_ZIP_NAME }}" >> $GITHUB_OUTPUT
          fi

      - name: Display Configuration
        run: |
          echo "::group::Configuration"
          echo "Kernel Variant: ${{ github.event.inputs.KERNEL_VARIANT }}"
          echo "Kernel Tree: ${{ steps.kernel-config.outputs.KERNEL_TREE }}/tree/${{ steps.kernel-config.outputs.KERNEL_TREE_BRANCH }}"
          echo "Add KernelSU: ${{ steps.kernel-config.outputs.ADD_KERNELSU }}"
          echo "KernelSU Name: ${{ steps.kernel-config.outputs.KERNELSU_NAME }}"
          echo "KernelSU Setup URL: ${{ steps.kernel-config.outputs.KERNELSU_SETUP_URL }}"
          echo "KernelSU Branch: ${{ steps.kernel-config.outputs.KERNELSU_SETUP_BRANCH }}"
          echo "AnyKernel URL: ${{ steps.kernel-config.outputs.ANYKERNEL_URL }}/tree/${{ steps.kernel-config.outputs.ANYKERNEL_BRANCH }}"
          echo "Generated Release Tag: ${{ needs.prepare.outputs.release_tag }}"
          echo "::endgroup::"

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-21
          restore-keys: |
            aosp-clang-21-

      - name: Download and Extract Clang (if not cached)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget "${{ env.CLANG_DOWNLOAD_LINK }}" -O clang.tar.xz
          mkdir -p clang
          tar -xf clang.tar.xz -C clang

          cd clang
          if [ -d clang-* ]; then
            mv clang-*/* .
          fi
          cd ..

          rm clang.tar.xz

      - name: Initialize workspace
        run: |
          echo "tools_folder=$(pwd)" >> $GITHUB_OUTPUT
          git clone --depth=1 ${{ steps.kernel-config.outputs.KERNEL_TREE }} -b ${{ steps.kernel-config.outputs.KERNEL_TREE_BRANCH }} kernel_tree
          echo "kernel_folder=$(pwd)/kernel_tree" >> $GITHUB_OUTPUT
          
          # Create releases directory
          mkdir -p releases
        id: workspace

      - name: Building kernel
        run: |
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="${{ github.actor }}"
          export KBUILD_BUILD_HOST="GitHub"
          
          if [ "${{ steps.kernel-config.outputs.ADD_KERNELSU }}" == 'true' ]; then
            curl -LSs "${{ steps.kernel-config.outputs.KERNELSU_SETUP_URL }}" | bash -s ${{ steps.kernel-config.outputs.KERNELSU_SETUP_BRANCH }}
          fi

          make O=out vendor/munch_defconfig PATH="${{ steps.workspace.outputs.tools_folder }}/clang/bin:$PATH"
          make O=out CC=clang -j$(nproc --all) PATH="${{ steps.workspace.outputs.tools_folder }}/clang/bin:$PATH" CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}

      - name: Prepare kernel files for packaging
        run: |
          # Create a directory to store build artifacts
          mkdir -p kernel_files
          
          # Copy all required files
          if [ -e "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/Image.gz" ]; then
            cp "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/Image.gz" kernel_files/
          fi
          
          if [ -e "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtb.img" ]; then
            cp "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtb.img" kernel_files/
          fi
          
          if [ -e "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtbo.img" ]; then
            cp "${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/dtbo.img" kernel_files/
          fi

      - name: Generate filename
        id: generate-filename
        run: |
          # Base name with KSU suffix if enabled
          BASE_NAME="${{ steps.kernel-config.outputs.ANYKERNEL_ZIP_NAME }}"
          
          if [ "${{ steps.kernel-config.outputs.ADD_KERNELSU }}" == 'true' ]; then
            BASE_NAME="${BASE_NAME}-${{ steps.kernel-config.outputs.KERNELSU_NAME }}"
          fi
          
          # Add SuSFS to name if using SuSFS branch
          if [[ "${{ steps.kernel-config.outputs.KERNEL_TREE_BRANCH }}" == *"susfs"* ]]; then
            BASE_NAME="${BASE_NAME}-SuSFS"
          fi
          
          # Generate filename for unified package
          FILENAME="${BASE_NAME}-${{ needs.prepare.outputs.release_tag }}"
          
          echo "FILENAME=${FILENAME}" >> $GITHUB_OUTPUT
          
          echo "Generated filename: ${FILENAME}"

      - name: Clone DTBO Repository
        run: |
          # Clone the AKMunch repository to get DTBO variants
          git clone --depth=1 ${DTBO_REPO_URL} -b ${DTBO_REPO_BRANCH} dtbo-source || true
          
          # Create variant directories for different DTBOs
          mkdir -p miui ir default
          
          # Copy the original DTBO to default
          cp -f kernel_files/dtbo.img default/ || true
          
          # Copy variant DTBOs from repository if available
          cp -f dtbo-source/miui/dtbo.img miui/ || cp -f kernel_files/dtbo.img miui/ || true
          cp -f dtbo-source/ir/dtbo.img ir/ || cp -f kernel_files/dtbo.img ir/ || true

      - name: Package Unified Kernel
        run: |
          # Clone AnyKernel repository
          git clone --recursive --depth=1 ${{ steps.kernel-config.outputs.ANYKERNEL_URL }} -b ${{ steps.kernel-config.outputs.ANYKERNEL_BRANCH }} AnyKernel3-Unified
          
          # Copy kernel files to AnyKernel3
          cp -f kernel_files/Image.gz AnyKernel3-Unified/ || true
          cp -f kernel_files/dtb.img AnyKernel3-Unified/dtb || true
          
          # Copy the default DTBO to root
          cp -f default/dtbo.img AnyKernel3-Unified/dtbo.img || true
          
          # Create variant directories
          mkdir -p AnyKernel3-Unified/miui
          mkdir -p AnyKernel3-Unified/ir
          
          # Copy variant DTBOs to their respective directories
          cp -f miui/dtbo.img AnyKernel3-Unified/miui/dtbo.img || true
          cp -f ir/dtbo.img AnyKernel3-Unified/ir/dtbo.img || true
          
          # Create zip
          cd AnyKernel3-Unified
          zip -q -r "${{ steps.generate-filename.outputs.FILENAME }}.zip" *
          mv "${{ steps.generate-filename.outputs.FILENAME }}.zip" ../releases/

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate-filename.outputs.FILENAME }}
          path: releases/${{ steps.generate-filename.outputs.FILENAME }}.zip
          retention-days: 1

  create-release:
    needs: [prepare, build-matrix, build-single]
    if: always() && (needs.prepare.outputs.build_mode == 'matrix' && needs.build-matrix.result == 'success') || (needs.prepare.outputs.build_mode == 'single' && needs.build-single.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Kernel Artifacts
        uses: actions/download-artifact@v4
        with:
          path: kernels

      - name: Create Release Notes
        run: |
          BUILD_MODE="${{ needs.prepare.outputs.build_mode }}"
          
          if [ "$BUILD_MODE" = "matrix" ]; then
            VARIANTS_TEXT="This release includes the following kernel variants:
          
          - **No KernelSU**: Standard kernel without KernelSU
          - **KernelSU-Next**: Kernel with KernelSU-Next integration
          - **KernelSU-Next with SuSFS**: Kernel with KernelSU-Next and SuSFS support"
          else
            SELECTED_VARIANT="${{ github.event.inputs.KERNEL_VARIANT }}"

            case $SELECTED_VARIANT in
              "No KernelSU")
                DESC="Standard kernel without KernelSU";;
              "KernelSU-Next Only")
                DESC="Kernel with KernelSU-Next integration";;
              "KernelSU-Next with SuSFS")
                DESC="Kernel with KernelSU-Next and SuSFS support";;
              "Custom Configuration")
                DESC="Custom kernel configuration with parameters:
                - Tree: ${{ github.event.inputs.KERNEL_TREE }}
                - Branch: ${{ github.event.inputs.KERNEL_TREE_BRANCH }}
                - KernelSU: ${{ github.event.inputs.ADD_KERNELSU }}";;
              *)
                DESC="Custom kernel variant";;
            esac

            VARIANTS_TEXT="This release includes the selected kernel variant:
            - **$SELECTED_VARIANT**: $DESC"
          fi
          
          cat > release_notes.md << EOF
          # N0Kontzzz for Munch (${{ needs.prepare.outputs.release_tag }})
          
          Build Date: $(date '+%Y-%m-%d %H:%M')
          
          ## Kernel Variants
          ${VARIANTS_TEXT}

          ## Installation
          Flash via recovery or KernelFlasher app.
          
          If using ADB sideload, you'll be prompted to select using volume buttons.

          ### Variant Selection
          To select a specific DTBO variant, rename the zip file before flashing:
          - For MIUI/HyperOS: Add "-miui" suffix (e.g., N0Kontzzz-munch-KSUN-20250421-1234-miui.zip)
          - For LineageOS IR Blaster: Add "-ir" suffix (e.g., N0Kontzzz-munch-KSUN-20250421-1234-ir.zip)
          - For default: No suffix needed (e.g., N0Kontzzz-munch-KSUN-20250421-1234.zip)
          
          ## Credits
          - **EmanuelCN**: N0Kernel development
          - **rifsxd**: KernelSU-Next
          - **simonpunk**: SUSFS
          - **Impqxr**: N0Kernel fork & help
          - **osm0sis**: AnyKernel3 framework
          - **AOSP**: Clang compiler
          - **All testers and contributors**: For their valuable feedback and support
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: "N0Kontzzz Munch ${{ needs.prepare.outputs.release_tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: kernels/**/*.zip
